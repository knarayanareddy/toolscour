name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, arena/* ]
  schedule:
    # Daily cron: 02:00 UTC — re-harvest AI tools >= 500 stars & repack tiers
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Harvest AI Tools (GitHub GraphQL + HF Hub) & Refresh Catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # New AI tools: newer-ecosystem topics + star windows, both behind the relevance gate
          python3 -u pipeline/harvest_ai_tools.py --extended --pages 3
          # New Agent Skill Packs: each must ship a SKILL.md of at least 200 bytes
          python3 -u pipeline/harvest_ai_tools.py --skills --pages 3
          # Existing records: current metadata, archived/deleted removal, fuller topics
          # Curated named repos that search can miss (renamed or untagged); same star floor and archive check
          python3 -u pipeline/harvest_ai_tools.py --seeds pipeline/seed_repos.txt
          python3 -u pipeline/harvest_ai_tools.py --refresh
          python3 -u pipeline/harvest_ai_tools.py --fill-descriptions
          python3 -u pipeline/harvest_ai_tools.py --prune-non-ai --report "$RUNNER_TEMP/pruned.tsv"
          # Discovery from curated awesome lists (AI gate applied), then similar-tool lists
          python3 -u pipeline/harvest_ai_tools.py --awesome pipeline/awesome_sources.txt
          # Intel: first README paragraph per repo (~20 min), then hand-written top-tier entries
          python3 -u pipeline/harvest_ai_tools.py --readme-intel
          python3 -u pipeline/harvest_ai_tools.py --curated-intel
          python3 -u pipeline/harvest_ai_tools.py --alternatives

      - name: Quality Gate & Pack Tiered Shards
        run: |
          python3 -m unittest discover -s pipeline -p "test_*.py"
          python3 pipeline/validate_corpus.py
          python3 pipeline/shard_builder.py
          python3 pipeline/generate_stacks.py

      - name: Persist refreshed catalog (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          git config user.name "toolscour-bot"
          git config user.email "toolscour-bot@users.noreply.github.com"
          git add web/public
          if git diff --cached --quiet; then
            echo "No catalog changes today."
          else
            git commit -m "chore: daily catalog refresh ($(date -u +%F))"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Build Web Explorer
        working-directory: web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
